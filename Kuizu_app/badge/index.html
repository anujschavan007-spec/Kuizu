<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>3D Badge 360° View — KUIZU</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
  <meta name="description" content="Pure 360° 3D Trophy and Badge Inspector for KUIZU Gaming Platform." />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }

    #badge-app {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Ambient Subtle Backlight Pool */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(85vw, 600px);
      height: min(85vw, 600px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(70px);
      transition: background 0.8s ease;
      z-index: 1;
    }

    /* Minimalist Discreet Back Button */
    .minimal-back-btn {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      z-index: 50;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .minimal-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* 3D Canvas Stage */
    #canvas-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      cursor: grab;
      touch-action: none;
    }

    #canvas-viewport:active {
      cursor: grabbing;
    }

    #badge-three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Minimalist Loading Spinner */
    #loading-state {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="badge-app">
    <!-- Ambient Radial Glow Behind Badge -->
    <div id="ambient-glow" class="ambient-glow"></div>

    <!-- Minimal Floating Back Button -->
    <a href="/home" id="btn-back-home" class="minimal-back-btn" aria-label="Back to Kuizu" title="Back to Kuizu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>

    <!-- Pure 3D Canvas Viewport -->
    <div id="canvas-viewport">
      <canvas id="badge-three-canvas"></canvas>
    </div>

    <!-- Loading State -->
    <div id="loading-state">
      <div class="spinner-ring" id="spinner-ring"></div>
    </div>
  </div>

  <script type="module" src="/src/badgeViewer.ts"></script>
</body>
</html>
