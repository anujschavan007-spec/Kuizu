<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>3D Badge 360° View — KUIZU</title>
  <meta name="description" content="Interactive 360° 3D Trophy and Badge Inspector for KUIZU Gaming Platform." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #badge-app {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 50%, #0a0e17 0%, #000000 100%);
    }

    /* Top Ambient Glow Pool */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 500px);
      height: min(80vw, 500px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(60px);
      transition: background 0.8s ease;
      z-index: 1;
    }

    /* Top Navigation Bar */
    header.viewer-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      padding-top: max(16px, env(safe-area-inset-top));
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateX(-2px);
    }

    .badge-header-info {
      display: flex;
      flex-direction: column;
    }

    .badge-pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    .badge-title-header {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    @media (min-width: 640px) {
      .badge-title-header {
        font-size: 20px;
        max-width: 400px;
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Badge Switcher Dropdown */
    .badge-select-wrapper {
      position: relative;
    }

    .badge-dropdown-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .badge-dropdown-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .badge-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 240px;
      background: #090e17;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 3px;
      z-index: 50;
      max-height: 70vh;
      overflow-y: auto;
    }

    .badge-dropdown-menu.open {
      display: flex;
    }

    .badge-option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #94a3b8;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }

    .badge-option-item:hover, .badge-option-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .badge-option-item.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
    }

    .badge-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Canvas Stage */
    #canvas-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      cursor: grab;
      touch-action: none;
    }

    #canvas-viewport:active {
      cursor: grabbing;
    }

    #badge-three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Loading Overlay */
    #loading-state {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      gap: 16px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.3px;
    }

    .loading-subtext {
      font-size: 12px;
      color: #64748b;
    }

    /* Floating Control Toolbar */
    .controls-toolbar {
      position: absolute;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
    }

    .control-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      position: relative;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.45);
      color: #38bdf8;
    }

    .control-btn svg {
      width: 18px;
      height: 18px;
    }

    .control-separator {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Bottom Info Card */
    .badge-info-drawer {
      position: absolute;
      top: calc(max(16px, env(safe-area-inset-top)) + 74px);
      left: 20px;
      z-index: 18;
      max-width: 320px;
      background: rgba(10, 15, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      display: none;
    }

    @media (min-width: 768px) {
      .badge-info-drawer {
        display: block;
      }
    }

    .info-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .info-criterion {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .info-reward {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #10b981;
    }

    /* Gesture Hint Pill (Fades out after user first interacts) */
    .gesture-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 150px));
      z-index: 12;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.5s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .gesture-hint.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Toast Notification */
    #badge-toast {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translate(-50%, -60px);
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 15px rgba(56, 189, 248, 0.3);
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #badge-toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="badge-app">
    <!-- Ambient Radial Glow Behind Badge -->
    <div id="ambient-glow" class="ambient-glow"></div>

    <!-- Top Navigation Header -->
    <header class="viewer-header">
      <div class="header-left">
        <a href="/home" id="btn-back-home" class="back-btn" title="Return to Kuizu Dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Kuizu</span>
        </a>
        <div class="badge-header-info">
          <span class="badge-pill-tag">
            <span>🏆</span>
            <span id="header-tag-text">Official Trophy</span>
          </span>
          <h1 id="header-badge-title" class="badge-title-header">1st Problem Solver</h1>
        </div>
      </div>

      <div class="header-right">
        <!-- Switch Badge Dropdown -->
        <div class="badge-select-wrapper">
          <button type="button" id="dropdown-toggle" class="badge-dropdown-btn">
            <span>Switch Badge</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="dropdown-menu" class="badge-dropdown-menu">
            <!-- Dynamically populated badge options -->
          </div>
        </div>
      </div>
    </header>

    <!-- Desktop Info Drawer -->
    <div class="badge-info-drawer" id="info-drawer">
      <div class="info-label">Criteria</div>
      <div class="info-criterion" id="drawer-condition">Solve your first problem in Q-Library or Contests</div>
      <div class="info-reward">
        <span>⚡</span>
        <span>+100 XP Level Boost Added</span>
      </div>
    </div>

    <!-- 3D Canvas Stage -->
    <div id="canvas-viewport">
      <canvas id="badge-three-canvas"></canvas>
    </div>

    <!-- First Interaction Gesture Hint -->
    <div id="gesture-hint" class="gesture-hint">
      <span>👆</span>
      <span>Drag to rotate 360° • Pinch / scroll to zoom</span>
    </div>

    <!-- Loading State -->
    <div id="loading-state">
      <div class="spinner-ring" id="spinner-ring"></div>
      <div class="loading-text" id="loading-badge-title">Loading 3D Badge...</div>
      <div class="loading-subtext">Fetching binary .GLB model & shaders</div>
    </div>

    <!-- Floating Bottom Controls Toolbar -->
    <nav class="controls-toolbar" aria-label="3D Viewer Controls">
      <!-- Auto Rotate Toggle -->
      <button type="button" id="ctrl-auto-rotate" class="control-btn active" title="Toggle 360° Auto-Rotation (Spacebar)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>

      <!-- Zoom In -->
      <button type="button" id="ctrl-zoom-in" class="control-btn" title="Zoom In (+)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <!-- Zoom Out -->
      <button type="button" id="ctrl-zoom-out" class="control-btn" title="Zoom Out (-)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <!-- Reset View -->
      <button type="button" id="ctrl-reset-view" class="control-btn" title="Reset Camera View (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>

      <div class="control-separator"></div>

      <!-- Download GLB -->
      <a href="#" id="ctrl-download-glb" class="control-btn" title="Download 3D .GLB Model File" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </a>

      <!-- Share / Copy Link -->
      <button type="button" id="ctrl-copy-link" class="control-btn" title="Copy Direct 3D Viewer Link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>
    </nav>

    <!-- Feedback Toast -->
    <div id="badge-toast">
      <span id="toast-icon">🔗</span>
      <span id="toast-message">Link copied to clipboard!</span>
    </div>
  </div>

  <script type="module" src="/src/badgeViewer.ts"></script>
</body>
</html>
