<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating - KUIZU</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body.auth-callback-body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #eff6ff 0%, #e0e7ff 100%);
        font-family: 'Outfit', sans-serif;
      }
      .callback-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        padding: 48px 40px;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(79, 70, 229, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
        text-align: center;
        max-width: 420px;
        width: 90%;
        border: 1px solid rgba(224, 231, 255, 0.8);
      }
      .callback-spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #e0e7ff;
        border-top-color: #4f46e5;
        border-radius: 50%;
        margin: 0 auto 24px auto;
        animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .callback-title {
        font-size: 22px;
        font-weight: 700;
        color: #1e1b4b;
        margin: 0 0 10px 0;
      }
      .callback-subtitle {
        font-size: 14px;
        color: #64748b;
        margin: 0;
        line-height: 1.5;
      }
    </style>
      
      <!-- Global Theme & Accent Synchronous Preloader -->
    <script id="kuizu-theme-preloader">
      (function() {
        try {
          var fast = localStorage.getItem('kuizu_accent_color');
          var raw = localStorage.getItem('kuizu_user_settings_v1');
          var parsed = raw ? JSON.parse(raw) : null;
          var color = fast || (parsed && parsed.accentColor) || '#2563EB';
          var theme = (parsed && parsed.theme) || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark-mode');
            if (document.body) document.body.classList.add('dark-mode');
          } else {
            root.classList.remove('dark-mode');
            if (document.body) document.body.classList.remove('dark-mode');
          }
          function hexRgb(h, a) {
            var c = h.replace('#', '').trim();
            if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
            var n = parseInt(c, 16);
            if (isNaN(n) || c.length !== 6) return 'rgba(37, 99, 235, ' + a + ')';
            return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
          }
          function adjB(h, p) {
            var c = h.replace('#', '').trim();
            if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
            var n = parseInt(c, 16);
            if (isNaN(n) || c.length !== 6) return h;
            var r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 255) * (1 + p / 100))));
            var g = Math.min(255, Math.max(0, Math.round(((n >> 8) & 255) * (1 + p / 100))));
            var b = Math.min(255, Math.max(0, Math.round((n & 255) * (1 + p / 100))));
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
          }
          var darker = adjB(color, -16);
          var lightBg = isDark ? hexRgb(color, 0.22) : hexRgb(color, 0.08);
          root.style.setProperty('--primary-accent', color);
          root.style.setProperty('--color-primary', color);
          root.style.setProperty('--primary-accent-hover', darker);
          root.style.setProperty('--color-primary-hover', darker);
          root.style.setProperty('--primary-accent-light', lightBg);
          root.style.setProperty('--color-primary-light', lightBg);
          root.style.setProperty('--primary-accent-subtle', hexRgb(color, 0.14));
          root.style.setProperty('--primary-accent-glow', hexRgb(color, 0.38));
          root.style.setProperty('--primary-accent-border', hexRgb(color, 0.4));
          root.style.setProperty('--color-primary-border', hexRgb(color, 0.4));

          // Immediate background image dark sync
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
              if (root.classList.contains('dark-mode')) {
                document.querySelectorAll('.home-landscape-img').forEach(function(el){ el.src = '/images/home_landscape_dark.png'; });
                document.querySelectorAll('.settings-mountains-art').forEach(function(el){ el.src = '/images/settings_mountains_dark.png'; });
                document.querySelectorAll('.quiz-map-base-art').forEach(function(el){ el.src = '/images/quiz_clean_map_bg_dark.png'; });
              }
            });
          } else if (isDark) {
            document.querySelectorAll('.home-landscape-img').forEach(function(el){ el.src = '/images/home_landscape_dark.png'; });
            document.querySelectorAll('.settings-mountains-art').forEach(function(el){ el.src = '/images/settings_mountains_dark.png'; });
            document.querySelectorAll('.quiz-map-base-art').forEach(function(el){ el.src = '/images/quiz_clean_map_bg_dark.png'; });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="auth-callback-body">
    <div class="callback-card">
      <div class="callback-spinner"></div>
      <h2 class="callback-title">Completing Authentication</h2>
      <p class="callback-subtitle" id="callback-status">
        Verifying your credentials and preparing your KUIZU dashboard...
      </p>
    </div>

    <script type="module" src="/src/ssocallback.ts"></script>
  </body>
</html>
