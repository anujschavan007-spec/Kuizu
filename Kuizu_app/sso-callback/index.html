<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating - KUIZU</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body.auth-callback-body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #eff6ff 0%, #e0e7ff 100%);
        font-family: 'Outfit', sans-serif;
      }
      .callback-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        padding: 48px 40px;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(79, 70, 229, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
        text-align: center;
        max-width: 420px;
        width: 90%;
        border: 1px solid rgba(224, 231, 255, 0.8);
      }
      .callback-spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #e0e7ff;
        border-top-color: #4f46e5;
        border-radius: 50%;
        margin: 0 auto 24px auto;
        animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .callback-title {
        font-size: 22px;
        font-weight: 700;
        color: #1e1b4b;
        margin: 0 0 10px 0;
      }
      .callback-subtitle {
        font-size: 14px;
        color: #64748b;
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body class="auth-callback-body">
    <div class="callback-card">
      <div class="callback-spinner"></div>
      <h2 class="callback-title">Completing Authentication</h2>
      <p class="callback-subtitle" id="callback-status">
        Verifying your credentials and preparing your KUIZU dashboard...
      </p>
    </div>

    <script type="module" src="/src/ssocallback.ts"></script>
  </body>
</html>
