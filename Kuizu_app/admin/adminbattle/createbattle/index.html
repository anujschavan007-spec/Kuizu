      <!-- Global Theme & Accent Synchronous Preloader -->
    <script id="kuizu-theme-preloader">
      (function() {
        try {
          var fast = localStorage.getItem('kuizu_accent_color');
          var raw = localStorage.getItem('kuizu_user_settings_v1');
          var parsed = raw ? JSON.parse(raw) : null;
          var color = fast || (parsed && parsed.accentColor) || '#2563EB';
          var theme = (parsed && parsed.theme) || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark-mode');
            if (document.body) document.body.classList.add('dark-mode');
          } else {
            root.classList.remove('dark-mode');
            if (document.body) document.body.classList.remove('dark-mode');
          }
          function hexRgb(h, a) {
            var c = h.replace('#', '').trim();
            if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
            var n = parseInt(c, 16);
            if (isNaN(n) || c.length !== 6) return 'rgba(37, 99, 235, ' + a + ')';
            return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
          }
          function adjB(h, p) {
            var c = h.replace('#', '').trim();
            if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
            var n = parseInt(c, 16);
            if (isNaN(n) || c.length !== 6) return h;
            var r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 255) * (1 + p / 100))));
            var g = Math.min(255, Math.max(0, Math.round(((n >> 8) & 255) * (1 + p / 100))));
            var b = Math.min(255, Math.max(0, Math.round((n & 255) * (1 + p / 100))));
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
          }
          var darker = adjB(color, -16);
          var lightBg = isDark ? hexRgb(color, 0.22) : hexRgb(color, 0.08);
          root.style.setProperty('--primary-accent', color);
          root.style.setProperty('--color-primary', color);
          root.style.setProperty('--primary-accent-hover', darker);
          root.style.setProperty('--color-primary-hover', darker);
          root.style.setProperty('--primary-accent-light', lightBg);
          root.style.setProperty('--color-primary-light', lightBg);
          root.style.setProperty('--primary-accent-subtle', hexRgb(color, 0.14));
          root.style.setProperty('--primary-accent-glow', hexRgb(color, 0.38));
          root.style.setProperty('--primary-accent-border', hexRgb(color, 0.4));
          root.style.setProperty('--color-primary-border', hexRgb(color, 0.4));

          // Immediate background image dark sync
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
              if (root.classList.contains('dark-mode')) {
                document.querySelectorAll('.home-landscape-img').forEach(function(el){ el.src = '/images/home_landscape_dark.png'; });
                document.querySelectorAll('.settings-mountains-art').forEach(function(el){ el.src = '/images/settings_mountains_dark.png'; });
                document.querySelectorAll('.quiz-map-base-art').forEach(function(el){ el.src = '/images/quiz_clean_map_bg_dark.png'; });
              }
            });
          } else if (isDark) {
            document.querySelectorAll('.home-landscape-img').forEach(function(el){ el.src = '/images/home_landscape_dark.png'; });
            document.querySelectorAll('.settings-mountains-art').forEach(function(el){ el.src = '/images/settings_mountains_dark.png'; });
            document.querySelectorAll('.quiz-map-base-art').forEach(function(el){ el.src = '/images/quiz_clean_map_bg_dark.png'; });
          }
        } catch (_) {}
      })();
    </script>

                  <line x1="19" y1="21" x2="21" y2="19"></line>

                  <line x1="5" y1="14" x2="11" y2="20"></line>

            </div>

                <label class="admin-form-label" for="battle-select-problem">Select Problem from QLibrary (Optional)</label>
                <div class="admin-input-icon-wrap">
                  <svg class="admin-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                  </svg>
                  <select id="battle-select-problem" class="admin-select-input">
                    <option value="" selected>-- Choose an uploaded problem from library (or enter custom below) --</option>
                  </select>
                  <svg class="admin-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>

              <!-- Battle Title -->
              <div class="admin-form-group">
                <label class="admin-form-label" for="battle-title">Battle Title <span class="required-star">*</span></label>
                <div class="admin-input-icon-wrap">
                  <span class="admin-field-text-icon">T<sub>T</sub></span>
                  <input 
                    type="text" 
                    id="battle-title" 
                    class="admin-text-input has-icon" 
                    placeholder="Enter battle title..." 
                    required 
                  />
                </div>
              </div>

              <!-- Date & Time -->
              <div class="admin-form-group">
                <label class="admin-form-label" for="battle-datetime">Date & Time <span class="required-star">*</span></label>
                <div class="admin-input-icon-wrap">
                  <svg class="admin-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  <select id="battle-datetime" class="admin-select-input" required>
                    <option value="" disabled selected>Select date and time</option>
                    <option value="2025-04-21T18:00" selected>Apr 21, 2025, 06:00 PM</option>
                    <option value="2025-04-22T20:00">Apr 22, 2025, 08:00 PM</option>
                    <option value="2025-04-23T19:00">Apr 23, 2025, 07:00 PM</option>
                  </select>
                  <svg class="admin-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>

              <!-- Duration -->
              <div class="admin-form-group">
                <label class="admin-form-label" for="battle-duration">Duration <span class="required-star">*</span></label>
                <div class="admin-input-icon-wrap">
                  <svg class="admin-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  <select id="battle-duration" class="admin-select-input" required>
                    <option value="" disabled>e.g. 30 minutes</option>
                    <option value="15">15 minutes</option>
                    <option value="30" selected>e.g. 30 minutes</option>
                    <option value="45">45 minutes</option>
                    <option value="60">60 minutes</option>
                  </select>
                  <svg class="admin-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>

                    <option value="6">6 Players (Party Clash)</option>
                    <option value="8">8 Players (Team Rumble)</option>
                    <option value="10">10 Players (Decathlon)</option>
                    <option value="16">16 Players (Mega Bracket)</option>
                    <option value="32">32 Players (Grand Tournament)</option>
                    <option value="50">50 Players (Open Arena)</option>
                  </select>
                  <svg class="admin-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>

              <!-- Description -->

            <!-- Question Block 1 -->

                    <line x1="12" y1="17" x2="12.01" y2="17"></line>

                <div style="display: flex; align-items: center; gap: 10px;">
                  <button type="button" class="admin-btn-outline btn-remove-q-block" style="display:none; color:#ef4444; border-color:#fca5a5;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                      <polyline points="3 6 5 6 21 6"></polyline>
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Delete Question</span>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Question</span>
                  </button>
                </div>
              </div>

            <!-- Question input -->
            <div class="admin-form-group" style="margin-bottom: 22px;">
              <label class="admin-form-label" for="battle-question-text">Question <span class="required-star">*</span></label>
              <div class="admin-textarea-icon-wrap">
                <span class="admin-field-text-icon" style="top: 14px;">T<sub>T</sub></span>
                <textarea 
                  id="battle-question-text" 
                  class="admin-textarea-input" 
                  placeholder="Enter question here..." 
                  rows="3" 
                  required
                ></textarea>
              </div>
            </div>

            <!-- 4 Option Cards (2x2) -->
            <div class="admin-battle-options-grid" id="battle-options-container">
              
              <!-- Option A -->
              <div class="admin-battle-opt-card" data-opt="A">
                <div class="admin-drag-handle" title="Drag to reorder">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="9" cy="7" r="1.5"></circle>
                    <circle cx="9" cy="12" r="1.5"></circle>
                    <circle cx="9" cy="17" r="1.5"></circle>
                    <circle cx="15" cy="7" r="1.5"></circle>
                    <circle cx="15" cy="12" r="1.5"></circle>
                    <circle cx="15" cy="17" r="1.5"></circle>
                  </svg>
                </div>
                <div class="admin-battle-opt-badge">A</div>
                <input 
                  type="text" 
                  class="admin-battle-opt-input" 
                  placeholder="Enter answer option A..." 
                  value="Option A"
                  required 
                />
                <label class="admin-correct-answer-toggle">
                  <input type="checkbox" class="opt-correct-chk" value="A" checked />
                  <span class="admin-chk-circle"></span>
                  <span class="admin-chk-text">Correct answer</span>
                </label>
              </div>

              <!-- Option B -->
              <div class="admin-battle-opt-card" data-opt="B">
                <div class="admin-drag-handle" title="Drag to reorder">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="9" cy="7" r="1.5"></circle>
                    <circle cx="9" cy="12" r="1.5"></circle>
                    <circle cx="9" cy="17" r="1.5"></circle>
                    <circle cx="15" cy="7" r="1.5"></circle>
                    <circle cx="15" cy="12" r="1.5"></circle>
                    <circle cx="15" cy="17" r="1.5"></circle>
                  </svg>
                </div>
                <div class="admin-battle-opt-badge">B</div>
                <input 
                  type="text" 
                  class="admin-battle-opt-input" 
                  placeholder="Enter answer option B..." 
                  value="Option B"
                  required 
                />
                <label class="admin-correct-answer-toggle">
                  <input type="checkbox" class="opt-correct-chk" value="B" />
                  <span class="admin-chk-circle"></span>
                  <span class="admin-chk-text">Correct answer</span>
                </label>
              </div>

              <!-- Option C -->
              <div class="admin-battle-opt-card" data-opt="C">
                <div class="admin-drag-handle" title="Drag to reorder">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="9" cy="7" r="1.5"></circle>
                    <circle cx="9" cy="12" r="1.5"></circle>
                    <circle cx="9" cy="17" r="1.5"></circle>
                    <circle cx="15" cy="7" r="1.5"></circle>
                    <circle cx="15" cy="12" r="1.5"></circle>
                    <circle cx="15" cy="17" r="1.5"></circle>
                  </svg>
                </div>
                <div class="admin-battle-opt-badge">C</div>
                <input 
                  type="text" 
                  class="admin-battle-opt-input" 
                  placeholder="Enter answer option C..." 
                  value="Option C"
                  required 
                />
                <label class="admin-correct-answer-toggle">
                  <input type="checkbox" class="opt-correct-chk" value="C" />
                  <span class="admin-chk-circle"></span>
                  <span class="admin-chk-text">Correct answer</span>
                </label>
              </div>

              <!-- Option D -->
              <div class="admin-battle-opt-card" data-opt="D">
                <div class="admin-drag-handle" title="Drag to reorder">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="9" cy="7" r="1.5"></circle>
                    <circle cx="9" cy="12" r="1.5"></circle>
                    <circle cx="9" cy="17" r="1.5"></circle>
                    <circle cx="15" cy="7" r="1.5"></circle>
                    <circle cx="15" cy="12" r="1.5"></circle>
                    <circle cx="15" cy="17" r="1.5"></circle>
                  </svg>
                </div>
                <div class="admin-battle-opt-badge">D</div>
                <input 
                  type="text" 
                  class="admin-battle-opt-input" 
                  placeholder="Enter answer option D..." 
                  value="Option D"
                  required 
                />
                <label class="admin-correct-answer-toggle">
                  <input type="checkbox" class="opt-correct-chk" value="D" />
                  <span class="admin-chk-circle"></span>
                  <span class="admin-chk-text">Correct answer</span>
                </label>
              </div>

            </div>

            <!-- Dashed Dropzone -->
            <div class="admin-dashed-arrange-zone" id="arrange-dropzone">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="7" r="1.5"></circle>
                <circle cx="9" cy="12" r="1.5"></circle>
                <circle cx="9" cy="17" r="1.5"></circle>
                <circle cx="15" cy="7" r="1.5"></circle>
                <circle cx="15" cy="12" r="1.5"></circle>
                <circle cx="15" cy="17" r="1.5"></circle>
              </svg>
              <span>Drag answers here to arrange the battle options</span>
            </div>

            <!-- Correct Option(s) Multi Tags Selector -->
            <div class="admin-form-group" style="margin-top: 22px;">
              <label class="admin-form-label">Correct option(s) <span class="required-star">*</span></label>
              <div class="admin-tags-input-box" id="correct-tags-box">
                <div class="admin-tags-list" id="selected-tags-container">
                  <span class="admin-choice-tag" data-val="A">
                    <span>A</span>
                    <button type="button" class="btn-remove-tag" data-tag="A">✕</button>
                  </span>
                  <span class="admin-choice-tag" data-val="C">
                    <span>C</span>
                    <button type="button" class="btn-remove-tag" data-tag="C">✕</button>
                  </span>
                </div>
                <svg class="admin-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>

            <!-- Add Option Button -->
            <div style="margin-top: 18px;">
              <button type="button" class="admin-btn-outline" id="btn-add-opt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Option</span>
              </button>
            </div>

          </div>
          <!-- End Dynamic Questions List Container -->

          <!-- Bottom Actions Row -->
          <div class="admin-bottom-actions-row">
            <a href="/admin/adminbattle" class="admin-cancel-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>Cancel</span>
            </a>

            <button type="submit" class="admin-save-quiz-top-btn" id="save-battle-bottom-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              <span>Save Battle</span>
            </button>
          </div>

        </form>

      </main>

    </div>

    <!-- Toast Notification -->
    <div id="admin-toast" class="admin-toast"></div>

    <script type="module" src="/src/adminCreateBattle.ts"></script>
  </body>
</html>
