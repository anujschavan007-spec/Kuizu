<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In • KUIZU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-page-body">
    
    <!-- Top Header -->
    <header class="site-header auth-header">
      <div class="container nav-container">
        <a href="/" class="brand-logo" aria-label="KUIZU Home">
          <svg class="brand-icon" viewBox="0 0 48 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.5 3C7.5 3 3 7 3 13V22C3 28 8 33 13.5 33C17.5 33 21 30.5 22.5 26.5L24 23L25.5 26.5C27 30.5 30.5 33 34.5 33C40 33 45 28 45 22V13C45 7 40.5 3 35.5 3H12.5Z" fill="url(#authBrandGrad)" />
            <path d="M11 15H17M14 12V18" stroke="white" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="31.5" cy="17.5" r="2.2" fill="white" />
            <circle cx="36.5" cy="13.5" r="2.2" fill="white" />
            <defs>
              <linearGradient id="authBrandGrad" x1="3" y1="3" x2="45" y2="33" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F46E5" />
                <stop offset="1" stop-color="#7C3AED" />
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-text">KUIZU</span>
        </a>

        <div class="auth-top-motto">
          <span>Code</span>
          <span class="motto-dot">•</span>
          <span>Learn</span>
          <span class="motto-dot">•</span>
          <span>Grow</span>
        </div>
      </div>
    </header>

    <!-- Main Auth Layout -->
    <main class="auth-main-container">
      <div class="container auth-grid">
        
        <!-- Left Column: Welcome Message & Coder Artwork -->
        <div class="auth-left-col">
          <div class="auth-welcome-text">
            <h1 class="auth-heading">
              Welcome Back to <br />
              <span class="brand-accent">KUIZU</span>
            </h1>
            <p class="auth-subheading">
              Log in to continue your coding journey. Solve problems, join contests and level up your skills!
            </p>
          </div>

          <!-- Illustration: Boy in hoodie at stone desk with code, castle, floating pet -->
          <div class="auth-illustration-wrap">
            <img 
              src="/images/auth_coder_bottom.png" 
              alt="Coder learning at stone desk with floating mascot and castle" 
              class="auth-coder-img"
            />
          </div>
        </div>

        <!-- Right Column: The White Rounded Auth Card -->
        <div class="auth-right-col">
          <div class="auth-card-popup">
            
            <!-- Card Header with Mini Logo -->
            <div class="auth-card-header">
              <div class="auth-card-brand">
                <svg class="auth-card-icon" viewBox="0 0 48 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.5 3C7.5 3 3 7 3 13V22C3 28 8 33 13.5 33C17.5 33 21 30.5 22.5 26.5L24 23L25.5 26.5C27 30.5 30.5 33 34.5 33C40 33 45 28 45 22V13C45 7 40.5 3 35.5 3H12.5Z" fill="url(#cardBrandGrad)" />
                  <path d="M11 15H17M14 12V18" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                  <circle cx="31.5" cy="17.5" r="2.2" fill="white" />
                  <circle cx="36.5" cy="13.5" r="2.2" fill="white" />
                  <defs>
                    <linearGradient id="cardBrandGrad" x1="3" y1="3" x2="45" y2="33" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#4F46E5" />
                      <stop offset="1" stop-color="#7C3AED" />
                    </linearGradient>
                  </defs>
                </svg>
                <span class="auth-card-logo-text">KUIZU</span>
              </div>

              <h2 class="auth-card-title">Login to Your Account</h2>
              <p class="auth-card-subtitle">
                Welcome back! Please enter your details to continue.
              </p>
              <div class="auth-card-pill-accent"></div>
            </div>

            <!-- Prominent Error Alert Banner -->
            <div id="auth-error-banner" class="auth-error-banner" style="display: none;"></div>

            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form-fields" data-auth-mode="signin">
              
              <!-- Email Field -->
              <div class="auth-input-group">
                <label class="auth-label" for="input-email">
                  <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                  <span>Email Address</span>
                </label>
                <div class="input-with-icon">
                  <svg class="field-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input type="email" id="input-email" class="auth-text-input" placeholder="Enter your email" required />
                </div>
              </div>

              <!-- Password Field -->
              <div class="auth-input-group">
                <label class="auth-label" for="input-password">
                  <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <span>Password</span>
                </label>
                <div class="input-with-icon">
                  <svg class="field-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  <input type="password" id="input-password" class="auth-text-input" placeholder="Enter your password" required />
                  <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" aria-label="Toggle password visibility">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Checkbox & Forgot Password Row -->
              <div class="auth-form-options">
                <label class="checkbox-container">
                  <input type="checkbox" id="check-remember" checked />
                  <span class="checkbox-custom"></span>
                  <span class="checkbox-label-text">Remember me</span>
                </label>
                <a href="#" class="forgot-link" id="link-forgot-pwd">Forgot password?</a>
              </div>

              <!-- Submit Button (Opens /home) -->
              <button type="submit" class="auth-submit-btn" id="auth-submit-btn">
                <span>Login</span>
                <span class="auth-btn-arrow">→</span>
              </button>

              <!-- OR Divider -->
              <div class="auth-divider">
                <span class="divider-line"></span>
                <span class="divider-text">OR</span>
                <span class="divider-line"></span>
              </div>

              <!-- Social Sign In Options -->
              <div class="auth-social-row">
                <button type="button" class="btn-social btn-google" id="btn-social-google">
                  <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" />
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" />
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15Z" />
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" />
                  </svg>
                  <span>Continue with Google</span>
                </button>

                <button type="button" class="btn-social btn-github" id="btn-social-github">
                  <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z" />
                  </svg>
                  <span>Continue with GitHub</span>
                </button>
              </div>

              <!-- Switch to Sign Up -->
              <div class="auth-switch-text">
                <span>Don't have an account?</span>
                <a href="/sign-up" class="auth-switch-link">Sign Up</a>
              </div>

            </form>

          </div>
        </div>

      </div>
    </main>

    <!-- Sign In TypeScript Logic -->
    <script type="module" src="/src/auth.ts"></script>
  </body>
</html>
